  #   volumes:
  #     - app-data:/data
  #   devices:
  #     - "/dev/ttyUSB0:/dev/ttyUSB0"
  #   group_add:
  #     - dialout
  #   command: ["python", "manage.py", "read_serial"]
  #   depends_on:
  #     redis:
  #       condition: service_healthy

volumes:
  app-data:
