services:
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # Cache only — no persistence needed, readings are also written to the DB.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    env_file: .env.docker
    environment:
      REDIS_URL: redis://redis:6379/1
      DATA_DIR: /data
      MEDIA_ROOT: /data/media
      STATIC_ROOT: /app/staticfiles
    volumes:
      # SQLite database + uploaded images
      - app-data:/data
    ports:
      # Bound to one address on purpose. Docker publishes ports by writing its
      # own iptables rules, which are evaluated before ufw's, so a published
      # port on 0.0.0.0 stays reachable from the LAN no matter what ufw says.
      # Binding here is what actually restricts it.
      #
      # Set BIND_ADDR in a .env file beside this one (Compose reads it for
      # substitution; it is separate from .env.docker, which sets the app's
      # environment). For Tailscale-only access:
      #     BIND_ADDR=100.x.y.z      # from: tailscale ip -4
      # Defaults to loopback, so a missing value fails closed rather than
      # exposing the app.
      - "${BIND_ADDR:-127.0.0.1}:8000:8000"
    depends_on:
      redis:
        condition: service_healthy

  # Optional: only if the Arduino is plugged into the remote server over USB.
  # Remote devices posting to /sensors/ingest/sps30 do not need this.
  # serial-reader:
  #   build: .
  #   restart: unless-stopped
  #   env_file: .env.docker
  #   environment:
  #     REDIS_URL: redis://redis:6379/1
  #     DATA_DIR: /data
  #   volumes:
  #     - app-data:/data
  #   devices:
  #     - "/dev/ttyUSB0:/dev/ttyUSB0"
  #   group_add:
  #     - dialout
  #   command: ["python", "manage.py", "read_serial"]
  #   depends_on:
  #     redis:
  #       condition: service_healthy

volumes:
  app-data:
